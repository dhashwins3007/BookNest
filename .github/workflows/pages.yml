name: Deploy BookNest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build application
        shell: bash
        run: |
          if [ -f package.json ]; then
            APP_DIR="."
          elif [ -f lib-management/package.json ]; then
            APP_DIR="lib-management"
          else
            echo "Cannot find project package.json"
            exit 1
          fi

          cd "$APP_DIR"
          npm ci --include=dev
          npm run build -- --base=/BookNest/
          cp -R dist "$GITHUB_WORKSPACE/pages-output"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
